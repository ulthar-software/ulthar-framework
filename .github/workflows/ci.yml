name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "yarn"

      - run: yarn install --immutable

      - run: yarn build:all

      - run: yarn fmt

      - run: yarn lint

      - run: yarn test:all
